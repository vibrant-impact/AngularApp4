<div class="cosmic-app-shell">
  <mat-toolbar class="cosmic-header">
    <div class="header-inner">
      <div class="brand-group">
        <span class="brand-title">✦ Syzygy</span>
        <span class="brand-subtitle">Astrological Transit &amp; Cosmic Alignment Planner</span>
      </div>

      <div class="header-controls">
        <span class="status-pill">
          RSVPs: {{ eventService.committedCount() }} Active ·
          {{ eventService.completedCount() }} Completed
        </span>

        <!-- Simulated HTTP Failure Toggle for Error-Handling Demonstration -->
        <mat-slide-toggle
          [checked]="eventService.simulateServerFailure()"
          (change)="eventService.simulateServerFailure.set($event.checked)"
        >
          Simulate HTTP Error
        </mat-slide-toggle>
      </div>
    </div>
  </mat-toolbar>

  <main class="cosmic-main">
    <app-event-list />
  </main>

  <footer class="cosmic-footer">
    <span>Syzygy · VSOP87 &amp; ELP2000 Tropical Ephemeris · Angular 19 &amp; Angular Material</span>
  </footer>
</div>
